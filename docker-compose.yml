services:
  otp-build:
    image: opentripplanner/opentripplanner:2.8.1
    container_name: otp-build
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx8g"
    volumes:
      - ./data:/var/opentripplanner
    command: >
      --build --save
    profiles:
      - build

  otp-serve:
    image: opentripplanner/opentripplanner:2.8.1
    container_name: otp-serve
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx4g"
    volumes:
      - ./data:/var/opentripplanner
    ports:
      - "8080:8080"
    command: >
      --load --serve
    profiles:
      - serve

  jupyter:
    build:
      context: .
      dockerfile: Dockerfile.jupyter
    container_name: jupyter
    volumes:
      - ./notebooks:/home/jovyan/work
      - ./data:/data
      - ./results:/results
      - ./src:/home/jovyan/work/src
    ports:
      - "8888:8888"
    profiles:
      - serve
    command: >
      start-notebook.sh
      --ServerApp.token=''
      --ServerApp.password=''
 
